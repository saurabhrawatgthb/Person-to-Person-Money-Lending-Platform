version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: smart-p2p-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: smart-p2p-lending
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:

